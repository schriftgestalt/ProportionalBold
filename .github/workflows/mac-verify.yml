name: mac-verify (stage 1 – feasibility probe)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      GLYPHS3_URL: https://updates.glyphsapp.com/latest3.php
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: System info + desktop screenshot (proves the GUI session)
        timeout-minutes: 2
        continue-on-error: true
        run: |
          mkdir -p mac/log
          { sw_vers; uname -m; whoami; csrutil status || true; } 2>&1 | tee mac/log/00-sysinfo.txt
          screencapture -x mac/log/01-desktop.png || echo "screencapture rc=$?" | tee -a mac/log/00-sysinfo.txt
          ls -la mac/log

      - name: Download + install Glyphs 3 into /Applications
        timeout-minutes: 4
        continue-on-error: true
        run: |
          curl -L --retry 3 --max-time 180 -o /tmp/Glyphs3.zip "$GLYPHS3_URL"
          ditto -xk /tmp/Glyphs3.zip /Applications
          xattr -dr com.apple.quarantine "/Applications/Glyphs 3.app" || true
          ls /Applications | grep -i glyphs | tee mac/log/02-installed.txt
          for k in CFBundleShortVersionString CFBundleVersion CFBundleIdentifier LSMinimumSystemVersion; do
            echo "$k = $(defaults read "/Applications/Glyphs 3.app/Contents/Info.plist" $k)" | tee -a mac/log/02-installed.txt
          done

      - name: Framework Python 3.11 + PyObjC + glyphs-cli
        timeout-minutes: 6
        continue-on-error: true
        run: |
          brew install python@3.11 2>&1 | tail -3
          PY=/opt/homebrew/opt/python@3.11/bin/python3.11
          PYFW=/opt/homebrew/opt/python@3.11/Frameworks/Python.framework
          echo "PY=$PY" >> "$GITHUB_ENV"; echo "PYFW=$PYFW" >> "$GITHUB_ENV"
          $PY -m pip install --break-system-packages -q pyobjc-core pyobjc-framework-Cocoa pyobjc-framework-Quartz glyphs-cli
          $PY -c "import objc, AppKit, Foundation; print('pyobjc', objc.__version__)" | tee mac/log/03-python.txt
          ls -la "$PYFW/Versions/3.11/Python" | tee -a mac/log/03-python.txt
          G=$(find /opt/homebrew -type f -perm -u+x -name glyphs 2>/dev/null | head -1)
          echo "GLYPHS_CLI=$G" >> "$GITHUB_ENV"; echo "glyphs-cli at: $G" | tee -a mac/log/03-python.txt
          "$G" --version 2>&1 | tee -a mac/log/03-python.txt || true

      - name: Launch Glyphs 3 GUI, screenshot, try to pass the trial window without a human
        timeout-minutes: 4
        continue-on-error: true
        run: |
          "/Applications/Glyphs 3.app/Contents/MacOS/Glyphs 3" > mac/log/glyphs3-launch.log 2>&1 &
          sleep 30
          screencapture -x mac/log/04-after-launch.png || true
          pgrep -fl "Glyphs 3" | tee mac/log/05-process.txt
          # what windows/buttons does it show? (needs Accessibility; the error text is the finding)
          osascript -e 'tell application "System Events" to tell process "Glyphs 3" to get name of every window' > mac/log/06-windows.txt 2>&1 || true
          osascript -e 'tell application "System Events" to tell process "Glyphs 3" to get name of every button of window 1' >> mac/log/06-windows.txt 2>&1 || true
          # best non-click attempt: press the trial button by UI scripting
          osascript -e 'tell application "System Events" to tell process "Glyphs 3" to click button "Continue Trial" of window 1' > mac/log/07-click-trial.txt 2>&1 || true
          osascript -e 'tell application "System Events" to tell process "Glyphs 3" to click (first button of window 1 whose name contains "Trial")' >> mac/log/07-click-trial.txt 2>&1 || true
          sleep 3
          screencapture -x mac/log/08-after-click.png || true
          cat mac/log/06-windows.txt mac/log/07-click-trial.txt

      - name: Dump Glyphs 3 defaults, support folder, launch log
        timeout-minutes: 1
        continue-on-error: true
        run: |
          defaults read com.GeorgSeifert.Glyphs3 > mac/log/09-defaults-glyphs3.txt 2>&1 || true
          ls -la "$HOME/Library/Application Support/Glyphs 3" > mac/log/10-appsupport.txt 2>&1 || true
          head -100 mac/log/glyphs3-launch.log

      - name: (b) point Glyphs at the framework Python via GSPythonFrameworkPath, verify by remote script
        timeout-minutes: 4
        continue-on-error: true
        run: |
          printf 'import sys; print("PYVERSION", sys.version.split()[0])\n' > mac/pyversion.py
          # 1) is the remote channel usable while the trial window is still up?
          "$PY" mac/glyphs_remote.py 3 mac/pyversion.py > mac/log/11-remote-before-pref.txt 2>&1 || true
          cat mac/log/11-remote-before-pref.txt
          # 2) set the preference, relaunch, verify
          pkill -x "Glyphs 3" || true; sleep 3
          defaults write com.GeorgSeifert.Glyphs3 GSPythonFrameworkPath -string "$PYFW"
          defaults read com.GeorgSeifert.Glyphs3 GSPythonFrameworkPath | tee mac/log/12-pref.txt
          "/Applications/Glyphs 3.app/Contents/MacOS/Glyphs 3" >> mac/log/glyphs3-launch.log 2>&1 &
          sleep 30
          "$PY" mac/glyphs_remote.py 3 mac/pyversion.py > mac/log/13-remote-after-pref.txt 2>&1 || true
          cat mac/log/13-remote-after-pref.txt
          screencapture -x mac/log/14-after-pref.png || true

      - name: (b, no GUI) glyphs-cli headless run – Python version and the Offset Curve classes
        timeout-minutes: 4
        continue-on-error: true
        run: |
          pkill -x "Glyphs 3" || true; sleep 2
          "$GLYPHS_CLI" version list 2>&1 | tee mac/log/15-cli-versions.txt || true
          "$GLYPHS_CLI" run --app "/Applications/Glyphs 3.app" --python "$PYFW/Versions/3.11/Python" --plugins '' \
            -c 'import sys; from AppKit import NSClassFromString; print("PYVERSION", sys.version.split()[0]); print("GlyphsFilterOffsetCurve", NSClassFromString("GlyphsFilterOffsetCurve")); print("GSOffsetCurve", NSClassFromString("GSOffsetCurve"))' \
            2>&1 | tee mac/log/16-cli-run.txt || true
          "$GLYPHS_CLI" run --app "/Applications/Glyphs 3.app" --python "$PYFW/Versions/3.11/Python" --plugins ./ProportionalBold.glyphsPlugin \
            -c 'import objc; print("plugin class:", objc.lookUpClass("ProportionalBold"))' \
            2>&1 | tee mac/log/17-cli-plugin.txt || true

      - name: Final screenshot + process list
        timeout-minutes: 1
        continue-on-error: true
        run: |
          screencapture -x mac/log/18-final.png || true
          pgrep -fl Glyphs > mac/log/19-final-process.txt 2>&1 || true
          ls -la mac/log

      - name: Upload screenshots and logs
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: mac-probe-${{ github.run_id }}
          path: mac/log
          if-no-files-found: warn